<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#04142a" />
    <meta name="color-scheme" content="dark" />
    <meta name="description" content="SQUIDO: you begin as a tiny octopus. What you become is up to you." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="SQUIDO" />
    <meta name="application-name" content="SQUIDO" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="SQUIDO" />
    <meta property="og:description" content="You begin as a tiny octopus. What you become is up to you." />
    <meta property="og:image" content="https://squido.vercel.app/og-card.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="SQUIDO" />
    <meta name="twitter:description" content="You begin as a tiny octopus. What you become is up to you." />
    <meta name="twitter:image" content="https://squido.vercel.app/og-card.jpg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>SQUIDO</title>
    <!-- HaveAnApp Pulse: anonymous, cookieless usage counts, plus a random returning-visitor id kept on this device for this game. See README. -->
    <script defer src="https://haveanapp-pulse-collect.vercel.app/p.js" data-app="jelli" data-returning="on"></script>
    <script>window.pulse=window.pulse||function(){(pulse.q=pulse.q||[]).push(arguments)}</script>
    <style>
      /* Splash: shown from the first paint until the game is drawing, so launch never flashes blank. */
      #splash {
        position: fixed;
        inset: 0;
        z-index: 50;
        display: grid;
        place-content: center;
        justify-items: center;
        gap: 18px;
        background: radial-gradient(90% 70% at 50% 38%, #1a6a8e 0%, #0b3354 45%, #04142a 100%);
        transition: opacity 0.5s ease, visibility 0s linear 0.5s;
      }
      #splash.gone {
        opacity: 0;
        visibility: hidden;
      }
      #splash img {
        width: 112px;
        height: 112px;
        border-radius: 28px;
        box-shadow: 0 18px 50px rgba(0, 0, 0, 0.45), 0 0 0 1px rgba(255, 255, 255, 0.08);
        animation: splash-bob 2.4s ease-in-out infinite;
      }
      #splash span {
        font: 800 15px/1 system-ui, -apple-system, sans-serif;
        letter-spacing: 0.42em;
        padding-left: 0.42em;
        color: #ffb08f;
      }
      @keyframes splash-bob {
        50% {
          transform: translateY(-8px) rotate(-2deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #splash img {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="splash" aria-hidden="true"><img src="/icon.svg" alt="" /><span>SQUIDO</span></div>
    <div id="app">
      <canvas id="game" aria-label="SQUIDO game world"></canvas>
      <div id="ui"></div>
      <div id="rotate-hint" hidden></div>
    </div>
    <noscript>SQUIDO needs JavaScript to swim.</noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
