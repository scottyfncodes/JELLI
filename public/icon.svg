<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <title>SQUIDO</title>
  <defs>
    <radialGradient id="sea" cx="50%" cy="30%" r="80%">
      <stop offset="0" stop-color="#1f7896"/>
